# Trusted whitelist — the only gate for what Aureon may learn from via OmniSpider.
# Keys match Aureon taxonomy slugs (domain, subdomain, or micro-subdomain).
# Bridge resolves dotted paths (e.g. humanities.history.ancient_history) to the nearest key.

physics:
  seeds:
    - https://arxiv.org/
    - https://pubmed.ncbi.nlm.nih.gov/

history:
  seeds:
    - https://www.britannica.com/
    - https://www.worldhistory.org/

artificial_intelligence:
  seeds:
    - https://arxiv.org/
    - https://paperswithcode.com/

computer_science:
  seeds:
    - https://www.britannica.com/

biology:
  seeds:
    - https://pubmed.ncbi.nlm.nih.gov/
    - https://www.britannica.com/

mathematics:
  seeds:
    - https://arxiv.org/
    - https://www.britannica.com/

humanities:
  seeds:
    - https://www.britannica.com/
    - https://www.worldhistory.org/

science_and_natural_philosophy:
  seeds:
    - https://arxiv.org/
    - https://pubmed.ncbi.nlm.nih.gov/
    - https://www.britannica.com/

psychology:
  seeds:
    - https://pubmed.ncbi.nlm.nih.gov/
    - https://www.britannica.com/

economics:
  seeds:
    - https://www.britannica.com/
    - https://www.investopedia.com/

default:
  type: public
  seeds:
    - https://www.britannica.com/

# Unlisted public URLs — deep web without login (user-provided URL list).
unlisted_public:
  type: ingest
  ingest_list: config/url-lists/unlisted_public.txt
  seeds: []

# Personal Scribd library — deep web (login-gated, not search-indexed).
# type: authenticated → corpus sync only; public crawl of these seeds is blocked.
scribd:
  type: authenticated
  adapter: scribd
  seeds:
    - https://www.scribd.com/home
    - https://www.scribd.com/saved
